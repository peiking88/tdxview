[theme]
primaryColor = "#1a56db"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8f9fb"
textColor = "#1f2937"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
headless = true
enableCORS = false
enableXsrfProtection = true

[client]
showErrorDetails = false
toolbarMode = "minimal"
